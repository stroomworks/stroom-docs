<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="inherit">
  <style>svg{--bg:#ffffff;--surface-2:#eef1f5;--hair-strong:#c6ccd6;--fg:#14161a;--fg-muted:#576070;--fg-faint:#646d7c;--accent:#bb4b00;--accent-tint:#fff1e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#ffffff}</style>
  <defs>
    <marker id="cs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-faint)"/>
    </marker>
  </defs>
  <g font-size="13">
    <!-- two nodes, identical software -->
    <g transform="translate(0 16)">
      <rect width="200" height="150" rx="6" fill="var(--surface-2)" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <text x="16" y="28" fill="var(--fg)" font-weight="600">Node A</text>
      <text x="16" y="46" fill="var(--accent)" font-size="12">holds the task queue</text>
      <text x="16" y="74" fill="var(--fg-faint)" font-size="12">ITS OWN</text>
      <text x="16" y="92" fill="var(--fg-muted)" font-size="12">Reference data store</text>
      <text x="16" y="110" fill="var(--fg-muted)" font-size="12">Plan B shards</text>
      <text x="16" y="128" fill="var(--fg-muted)" font-size="12">Caches, index writers</text>
    </g>
    <g transform="translate(240 16)">
      <rect width="200" height="150" rx="6" fill="var(--surface-2)" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <text x="16" y="28" fill="var(--fg)" font-weight="600">Node B</text>
      <text x="16" y="46" fill="var(--fg-muted)" font-size="12">asks A for work</text>
      <text x="16" y="74" fill="var(--fg-faint)" font-size="12">ITS OWN</text>
      <text x="16" y="92" fill="var(--fg-muted)" font-size="12">Reference data store</text>
      <text x="16" y="110" fill="var(--fg-muted)" font-size="12">Plan B shards</text>
      <text x="16" y="128" fill="var(--fg-muted)" font-size="12">Caches, index writers</text>
    </g>

    <text x="470" y="40" fill="var(--fg-muted)" font-size="12">Same software on</text>
    <text x="470" y="58" fill="var(--fg-muted)" font-size="12">every node. What</text>
    <text x="470" y="76" fill="var(--fg-muted)" font-size="12">differs is which jobs</text>
    <text x="470" y="94" fill="var(--fg-muted)" font-size="12">are enabled on it.</text>

    <!-- what they share -->
    <g stroke="var(--fg-faint)" stroke-width="1.5" fill="none" marker-end="url(#cs-arrow)">
      <path d="M100 166 L100 206"/>
      <path d="M340 166 L340 206"/>
    </g>

    <g transform="translate(0 212)">
      <rect width="440" height="54" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="16" y="24" fill="var(--fg)" font-weight="600">One database for the whole cluster</text>
      <text x="16" y="43" fill="var(--fg-muted)" font-size="12">metadata, processing state, users, jobs, locks</text>
    </g>
    <g transform="translate(0 278)">
      <rect width="440" height="44" rx="6" fill="none" stroke="var(--hair-strong)" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="16" y="27" fill="var(--fg-muted)" font-size="12">Volumes, which may be local to a node or shared storage</text>
    </g>

    <text x="470" y="236" fill="var(--fg-muted)" font-size="12">Nodes agree with</text>
    <text x="470" y="254" fill="var(--fg-muted)" font-size="12">each other only</text>
    <text x="470" y="272" fill="var(--fg-muted)" font-size="12">through the database.</text>
  </g>
</svg>
