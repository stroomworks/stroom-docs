<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="inherit">
  <style>svg{--bg:#ffffff;--surface-2:#eef1f5;--hair-strong:#c6ccd6;--fg:#14161a;--fg-muted:#576070;--fg-faint:#646d7c;--accent:#bb4b00;--accent-tint:#fff1e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#ffffff}</style>
  <g font-size="13">
    <!-- reference data -->
    <g transform="translate(0 20)">
      <rect width="220" height="248" rx="6" fill="var(--surface-2)" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <rect width="220" height="4" rx="2" fill="var(--hair-strong)"/>
      <text x="18" y="34" fill="var(--fg)" font-weight="600">Reference data</text>
      <text x="18" y="62" fill="var(--fg-faint)" font-size="12">LOADED BY</text>
      <text x="18" y="80" fill="var(--fg-muted)">A reference feed</text>
      <text x="18" y="110" fill="var(--fg-faint)" font-size="12">LIVES IN</text>
      <text x="18" y="128" fill="var(--fg-muted)">An off-heap store,</text>
      <text x="18" y="146" fill="var(--fg-muted)">on each node</text>
      <text x="18" y="176" fill="var(--fg-faint)" font-size="12">CORRECTED BY</text>
      <text x="18" y="194" fill="var(--fg-muted)">Fixing the feed and</text>
      <text x="18" y="212" fill="var(--fg-muted)">reloading</text>
      <text x="18" y="240" fill="var(--fg-muted)" font-size="12">Loads lazily, so you pay</text>
      <text x="18" y="256" fill="var(--fg-muted)" font-size="12">only for what is used.</text>
    </g>

    <!-- plan b -->
    <g transform="translate(250 20)">
      <rect width="220" height="248" rx="6" fill="var(--surface-2)" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <rect width="220" height="4" rx="2" fill="var(--hair-strong)"/>
      <text x="18" y="34" fill="var(--fg)" font-weight="600">Plan B</text>
      <text x="18" y="62" fill="var(--fg-faint)" font-size="12">LOADED BY</text>
      <text x="18" y="80" fill="var(--fg-muted)">A pipeline, per node</text>
      <text x="18" y="110" fill="var(--fg-faint)" font-size="12">LIVES IN</text>
      <text x="18" y="128" fill="var(--fg-muted)">Local shards, merged</text>
      <text x="18" y="146" fill="var(--fg-muted)">and read as snapshots</text>
      <text x="18" y="176" fill="var(--fg-faint)" font-size="12">CORRECTED BY</text>
      <text x="18" y="194" fill="var(--fg-muted)">Rewriting the source</text>
      <text x="18" y="212" fill="var(--fg-muted)">and re-merging</text>
      <text x="18" y="240" fill="var(--fg-muted)" font-size="12">Built for very high</text>
      <text x="18" y="256" fill="var(--fg-muted)" font-size="12">lookup rates.</text>
    </g>

    <!-- sql temporal store: the one you can edit -->
    <g transform="translate(500 20)">
      <rect width="220" height="248" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>
      <rect width="220" height="4" rx="2" fill="var(--accent)"/>
      <text x="18" y="34" fill="var(--fg)" font-weight="600">SQL Temporal Store</text>
      <text x="18" y="62" fill="var(--fg-faint)" font-size="12">LOADED BY</text>
      <text x="18" y="80" fill="var(--fg-muted)">A pipeline, or by hand</text>
      <text x="18" y="110" fill="var(--fg-faint)" font-size="12">LIVES IN</text>
      <text x="18" y="128" fill="var(--fg-muted)">The database, shared</text>
      <text x="18" y="146" fill="var(--fg-muted)">by the whole cluster</text>
      <text x="18" y="176" fill="var(--fg-faint)" font-size="12">CORRECTED BY</text>
      <text x="18" y="194" fill="var(--accent)" font-weight="600">Editing the entry</text>
      <text x="18" y="212" fill="var(--fg-muted)">in place</text>
      <text x="18" y="240" fill="var(--fg-muted)" font-size="12">For facts people</text>
      <text x="18" y="256" fill="var(--fg-muted)" font-size="12">maintain, not feeds.</text>
    </g>
  </g>
</svg>
