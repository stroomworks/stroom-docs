<svg viewBox="0 0 720 270" xmlns="http://www.w3.org/2000/svg" font-family="inherit">
  <style>svg{--bg:#ffffff;--surface-2:#eef1f5;--hair-strong:#c6ccd6;--fg:#14161a;--fg-muted:#576070;--fg-faint:#646d7c;--accent:#bb4b00;--accent-tint:#fff1e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#ffffff}</style>
  <defs>
    <marker id="ro-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--fg-faint)"/>
    </marker>
  </defs>
  <g font-size="13">
    <g transform="translate(0 100)">
      <rect width="150" height="60" rx="5" fill="var(--surface-2)" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <text x="75" y="27" text-anchor="middle" fill="var(--fg)" font-weight="600">Data arrives</text>
      <text x="75" y="46" text-anchor="middle" fill="var(--fg-muted)" font-size="12">at /datafeed</text>
    </g>

    <g transform="translate(210 100)">
      <rect width="160" height="60" rx="5" fill="var(--surface-2)" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <text x="80" y="27" text-anchor="middle" fill="var(--fg)" font-weight="600">Feed status</text>
      <text x="80" y="46" text-anchor="middle" fill="var(--fg-muted)" font-size="12">or receipt rules</text>
    </g>

    <g stroke="var(--fg-faint)" stroke-width="1.5" fill="none" marker-end="url(#ro-arrow)">
      <path d="M150 130 L202 130"/>
      <path d="M370 118 L400 118 L400 46 L432 46"/>
      <path d="M370 130 L432 130"/>
      <path d="M370 142 L400 142 L400 214 L432 214"/>
    </g>

    <!-- receive -->
    <g transform="translate(440 16)">
      <rect width="280" height="60" rx="5" fill="none" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <text x="16" y="26" fill="var(--fg)" font-weight="600">Receive</text>
      <text x="16" y="46" fill="var(--fg-muted)" font-size="12">sender sees success · data stored</text>
    </g>
    <!-- reject -->
    <g transform="translate(440 100)">
      <rect width="280" height="60" rx="5" fill="none" stroke="var(--hair-strong)" stroke-width="1.5"/>
      <text x="16" y="26" fill="var(--fg)" font-weight="600">Reject</text>
      <text x="16" y="46" fill="var(--fg-muted)" font-size="12">sender sees an error · nothing stored</text>
    </g>
    <!-- drop: the one that is invisible from both ends -->
    <g transform="translate(440 184)">
      <rect width="280" height="60" rx="5" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>
      <text x="16" y="26" fill="var(--accent)" font-weight="600">Drop</text>
      <text x="16" y="46" fill="var(--fg)" font-size="12">sender sees success · data discarded</text>
    </g>
  </g>
</svg>
